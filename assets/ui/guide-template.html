const stages=[
{id:'start',range:'1–10',title:'Your First Steps',text:'Learn Skinning plus Herbalism or Mining from the profession trainers in your starting zone. Follow RestedXP’s own questing guide to level 10. Humans start in Elwynn Forest, Dwarves and Gnomes in Dun Morogh, and Night Elves in Teldrassil. The supplied research places Skyborne on Zephras Isle at roughly 1–12; follow the actual available starter quests. Meet up at 10 and head toward the dwarven dungeon preparations.',zones:'Stay in your racial starting area. The research ranges extend to about 10–12; the party’s RestedXP handoff remains level 10.',ids:[]},
{id:'north',range:'10–15',title:'Into the Dwarven Halls',text:'Use Dun Morogh and Loch Modan while preparing Hall of Thanes. At level 9+: kill Dark Iron Spies for Dark Iron Map → Underground Map → Earthseer Farsen at Gol’Bolar Quarry → Old Ironforge Incursion. Pick up Important Heirlooms and The Restless Dead in Old Ironforge. Aim for the run around 14–15 as a group; two additional quests start inside.',zones:'Loch Modan is the party’s main preparation area. Westfall and Darkshore are alternative 10–20 questing zones, rather than additional zones to finish.',ids:['thanes']},
{id:'west',range:'15–22',title:'Westfall & the First Dungeons',text:'Continue to Westfall: start Gryan Stoutmantle’s Defias chain and Alba Fairmoon’s Testing the Wells / Toxic Soil chain early. Collect the Stormwind quests during the chains’ city visits, then run Deadmines. Wailing Caverns is a separate Kalimdor detour; combine it with Ratchet pickups and Darkshore questing if visiting that continent, aiming for around 20–22. A warlock should collect The Orb of Soran’ruk from Doan Karhan in the Barrens for the later Shadowfang Keep and Blackfathom runs. Save Ruins of Lordaeron for the combined northern trip.',zones:'Westfall or remaining Loch Modan/Darkshore quests through about 20. Use Redridge to fill gaps, then move toward Wetlands, Duskwood or Ashenvale as quests fit your level.',ids:['deadmines','wailing']},
{id:'silverpine',range:'22–24',title:'Lordaeron & Shadowfang',text:'Make one northern trip for both dungeons. Start with Ruins of Lordaeron at around level 22, then continue to Shadowfang Keep in Silverpine Forest. Check the Abominable Creatures pickup before leaving and collect the quest-starting items inside Ruins. Prepare The Test of Righteousness for any paladin and The Orb of Soran’ruk for any warlock before travelling. Gather the quest items and group the turn-ins after both runs.',zones:'Use your current 20–30 outdoor quest hub for any level gaps: Wetlands, Duskwood or Ashenvale. The northern visit is a combined dungeon trip, not a requirement to complete the surrounding Horde zones.',ids:['lordaeron','shadowfang']},
{id:'coast',range:'24–26',title:'Kalimdor & Blackfathom',text:'Take the boat from Menethil to Auberdine for Blackfathom Deeps. Prepare its quests through Ironforge, Darkshore, Darnassus and Ashenvale. Batch nearby Ashenvale quests while on this continent. Carry class quests forward from Shadowfang: warlocks need the remaining Soran’ruk fragments here; paladins should pick up Seeking the Kor Gem in Auberdine with The Test of Righteousness active.',zones:'Ashenvale is the local 20–30 option. Stay with Wetlands or Duskwood quests if travel or available objectives make those a better fit.',ids:['blackfathom']},
{id:'city',range:'26–30',title:'Stormwind & Wetlands',text:'Return to Stormwind for Stockades: prepare VanCleef’s letter chain, the Lakeshire quests and The Dark Iron War → The Fury Runs Deep in Wetlands. For Excavation Site, complete Tramping Paws → Fire Taboo → Blisters on the Land with Rethiel. Arrange Daily Delivery in Menethil, Songblade Search in Lakeshire and Seeking Caitlin in Astranaar → Caitlin in Menethil. Some follow-ups only become available after the dungeon. Finish toward 30 with nearby outdoor quests rather than adding unnecessary travel.',zones:'Wetlands, Duskwood or Ashenvale are overlapping 20–30 alternatives. Remaining Redridge quests can fill gaps. Choose a hub with useful quests; you do not need to clear every zone.',ids:['stockades','excavation']},
{id:'cap',range:'28–30',title:'Optional Final Stops',optional:true,text:'This overlaps the previous stage. Continue your existing outdoor quests to 30, or evaluate one of these optional dungeon stops if already nearby and ready for the current build. The supplied research reports City of Dalaran opened for beta testing on October 8; it does not establish a full run before 30. For Razorfen Kraul, collect Blueleaf Tubers in Ratchet before travelling south. Neither stop is treated as a proven faster route.',zones:'Continue Wetlands, Duskwood, Ashenvale or remaining Redridge quests. Dalaran and Razorfen Kraul are optional late-20s plans, not required steps.',ids:['dalaran','razorfen']},
{id:'future',range:'30+',title:'Saved Later Planning',planning:true,text:'The main route ends at level 30. These earlier dungeon notes are retained for your next session: collect Gnomeregan quests in Ironforge and Kharanos when convenient. Consider Scarlet Monastery wings individually; later wings and In the Name of the Light require progression beyond this route. Early access to a prerequisite does not schedule its dungeon completion before the cap.',zones:'Later planning only. These catalogue entries are not part of the 1–30 levelling recommendation.',ids:['gnomeregan','scarlet']}
];

function safeTooltip(html){const doc=new DOMParser().parseFromString(html,'text/html');const allowed=new Set(['B','STRONG','BR','SPAN','DIV','TABLE','TBODY','TR','TD','TH','SMALL','I']);const safeClasses=new Set(['q','moneygold','moneysilver','moneycopper','whtt-sellprice','wowhead-tooltip-item-classes']);function copy(node){if(node.nodeType===3)return document.createTextNode(node.textContent);if(node.nodeType!==1)return document.createDocumentFragment();if(['SCRIPT','STYLE','IFRAME','OBJECT','IMG','SVG','LINK'].includes(node.tagName))return document.createDocumentFragment();const tag=node.tagName==='A'?'SPAN':node.tagName;const target=allowed.has(tag)?document.createElement(tag.toLowerCase()):document.createDocumentFragment();if(target.nodeType===1)target.className=[...node.classList].filter(c=>/^q[0-6]$/.test(c)||/^c(?:[1-9]|1[0-3])$/.test(c)||safeClasses.has(c)).join(' ');for(const child of node.childNodes)target.append(copy(child));return target}const fragment=document.createDocumentFragment();for(const child of doc.body.childNodes)fragment.append(copy(child));return fragment}
function positionRewardTooltip(b,tip,event){if(!tip.isConnected)return;const box=b.getBoundingClientRect();if(event&&Number.isFinite(event.clientX)){tip.dataset.x=event.clientX;tip.dataset.y=event.clientY}let x=tip.dataset.x!==undefined?Number(tip.dataset.x)+16:box.right+12;let y=tip.dataset.y!==undefined?Number(tip.dataset.y)+16:box.top;const size=tip.getBoundingClientRect();const width=size.width||Math.min(300,innerWidth-24),height=size.height||tip.scrollHeight; if(x+width>innerWidth-12)x=(tip.dataset.x!==undefined?Number(tip.dataset.x):box.left)-width-12;x=Math.max(12,Math.min(x,innerWidth-width-12));y=Math.max(12,Math.min(y,innerHeight-height-12));tip.style.left=x+'px';tip.style.top=y+'px'}
function renderRewardTooltip(item,b,tip,data){tip.replaceChildren();if(data?.tooltip){tip.append(safeTooltip(data.tooltip));b.dataset.tooltipSource='Wowhead Forever · '+(data.checked||'live');if(Number.isInteger(data.quality))b.dataset.quality=['poor','common','uncommon','rare','epic','legendary'][data.quality]||'uncommon'}else{tip.append(el('strong','',item.name));for(const stat of item.stats||[]){const line=el('div',/^Equip:|^Use:/.test(stat)?'item-effect':/^Item Level/.test(stat)?'q':'',stat);tip.append(line)}tip.append(el('div','tooltip-unavailable',item.stats?.length?'Older snapshot · current Forever tooltip unavailable':'Current Forever item data unavailable'));b.dataset.tooltipSource='Unverified fallback'}const image=data?.image||b.querySelector('img.reward-icon')?.getAttribute('src')||(typeof data?.icon==='string'&&/^[a-zA-Z0-9_-]+$/.test(data.icon)?'https://wow.zamimg.com/images/wow/icons/large/'+data.icon.toLowerCase()+'.jpg':null);if(image){const icon=el('img','reward-icon');icon.loading='lazy';icon.decoding='async';icon.src=image;icon.alt='';icon.width=36;icon.height=36;icon.onerror=()=>{const cached=ITEM_TOOLTIPS[String(item.id)]?.image;if(cached&&icon.src!==cached)icon.src=cached;else icon.replaceWith(makeIcon(item))};b.querySelector('.reward-icon')?.replaceWith(icon)}b.setAttribute('aria-label',item.name);requestAnimationFrame(()=>positionRewardTooltip(b,tip))}

async function fetchItem(id){if(itemCache.has(id))return itemCache.get(id);const promise=new Promise(resolve=>{itemQueue.push(async()=>{try{const response=await fetch('https://nether.wowhead.com/forever/tooltip/item/'+encodeURIComponent(id),{signal:AbortSignal.timeout(7000)});if(!response.ok)throw Error('HTTP '+response.status);const data=await response.json();if(typeof data.tooltip!=='string'||!data.tooltip)throw Error('Tooltip missing');resolve(data)}catch{resolve(null)}finally{activeFetches--;drainQueue()}});drainQueue()});itemCache.set(id,promise);return promise}
function drainQueue(){while(activeFetches<4&&itemQueue.length){activeFetches++;itemQueue.shift()()}}
async function loadItem(item,b,tip){if(!refreshItems&&ITEM_TOOLTIPS[String(item.id)])return;if(b.dataset.loaded==='pending'||b.dataset.loaded==='live')return;b.dataset.loaded='pending';const data=await fetchItem(item.id);if(!data){b.dataset.loaded='offline';return}b.dataset.loaded='live';renderRewardTooltip(item,b,tip,data)}
window.addEventListener('resize',()=>document.querySelectorAll('.reward').forEach(b=>{const tip=b.querySelector('.tooltip');if(tip)positionRewardTooltip(b,tip)}));
function hideRewardTooltip(b){b.classList.remove('pinned','tooltip-open');const tip=b.querySelector('.tooltip');if(tip)tip.hidden=true}
function closeRewardTooltips(except){document.querySelectorAll('.reward.tooltip-open').forEach(b=>{if(b!==except)hideRewardTooltip(b)})}
function bindRewardTooltip(item,b,tip){let pointerType='mouse';tip.hidden=true;const open=e=>{closeRewardTooltips(b);tip.hidden=false;b.classList.add('tooltip-open');positionRewardTooltip(b,tip,e);if(item.id)loadItem(item,b,tip)};b.onpointerdown=e=>{pointerType=e.pointerType};b.onpointerenter=e=>{if(e.pointerType==='touch')return;pointerType=e.pointerType;open(e)};b.onpointermove=e=>{if(e.pointerType!=='touch'&&!tip.hidden)positionRewardTooltip(b,tip,e)};b.onpointerleave=e=>{if(e.pointerType!=='touch')hideRewardTooltip(b)};b.onfocus=()=>{if(b.matches(':focus-visible')){delete tip.dataset.x;delete tip.dataset.y;open()}};b.onblur=()=>hideRewardTooltip(b);b.onclick=e=>{if((e.pointerType||pointerType)==='touch'&&e.detail!==0){if(b.classList.contains('pinned'))hideRewardTooltip(b);else{open(e);b.classList.add('pinned')}}else if(e.detail===0){open()}else if(b.matches(':hover')){open(e)}else hideRewardTooltip(b)}}
document.addEventListener('pointerdown',event=>{document.querySelectorAll('.reward.tooltip-open').forEach(b=>{if(!b.contains(event.target))hideRewardTooltip(b)})});
document.addEventListener('keydown',event=>{if(event.key==='Escape')closeRewardTooltips()});
document.addEventListener('scroll',event=>{if(event.target instanceof Element&&event.target.closest('.tooltip'))return;document.querySelectorAll('.reward.tooltip-open').forEach(b=>{const box=b.getBoundingClientRect(),panel=b.closest('.main').getBoundingClientRect();if(b.classList.contains('pinned')||!b.matches(':hover')||box.bottom<=panel.top||box.top>=panel.bottom||box.bottom<=0||box.top>=innerHeight)hideRewardTooltip(b);else positionRewardTooltip(b,b.querySelector('.tooltip'))})},true);
window.addEventListener('blur',()=>closeRewardTooltips());


function showSources(){view='sources';selected=null;render()}
function sourceCard(name,url,desc,role){const article=el('article','source-card');if(role)article.append(el('div','source-role',role));const link=el('a','source-link',name+' ↗');link.href=url;link.target='_blank';link.rel='noopener noreferrer';article.append(link,el('p','',desc));return article}
function renderSources(){main.append(el('h2','','Research, Sources & Patch Notes'),el('p','subtitle','Research compiled October 10, 2026 · Alliance · Levels 1–30'),el('p','pending-box',RESEARCH.basis));const evidence=el('article','paper research-evidence');evidence.append(el('h3','','How to Read This Guide'));for(const [title,text]of [['Approximate zone direction',RESEARCH.routeAssessment],['Dungeon and item database evidence','Quest chains use community snapshots, and published map coordinates were checked against Wowhead Forever. A database position does not establish that the quest works in the current game build. Live item tooltips take precedence over the offline snapshot.'],['Official patch information','The changes below are attributed to Blizzard in the supplied research. The official post is linked; direct verification is pending. These claims are separate from the route suggestions.'],['Unmeasured speed advice','No exact XP-per-hour or completion-time claims are used. This page is a general party route, with preparation checklists; a tested quest-by-quest speedrun still needs validation of quest order, prerequisites, coordinates and the current beta build.']]){evidence.append(el('h4','',title),el('p','',text))}main.append(evidence);const patch=el('article','source-card patch-notes');patch.append(el('div','source-role','Reported official patch · '+RESEARCH.patch.date),el('h3','','October 8: Dungeon XP & Dalaran'),el('p','',RESEARCH.patch.status));const changes=el('ul');RESEARCH.patch.changes.forEach(change=>changes.append(el('li','',change)));patch.append(changes,el('p','',RESEARCH.patch.implication));const patchlink=el('a','source-link','Read Blizzard’s Development Notes ↗');patchlink.href=RESEARCH.patch.url;patchlink.target='_blank';patchlink.rel='noopener noreferrer';patch.append(patchlink);main.append(patch,el('h2','','Levelling References'));for(const source of RESEARCH.sources)main.append(sourceCard(source.name,source.url,source.assessment,source.role));main.append(el('h2','','Quest, Item & Map Sources'));for(const [name,url,desc]of [['Wowhead Forever','https://www.wowhead.com/forever','Quest pickup and turn-in positions were fetched from Forever quest pages on October 10, 2026. The map view includes original Classic+ in-game maps. Item tooltips and original icons were fetched from Forever and cached on October 10, 2026. Cached data works offline; Refresh Wowhead Tooltips requests a live update. Locations without published coordinates have instructions instead of guessed pins.'],['Dungeon Questie','https://github.com/coffeelover1010/dungeon-questie','Quest lists, recursive prerequisites, pickup locations, objectives and rewards. Community source data checked through October 9, 2026; unresolved links remain flagged.'],['GearQuest Forever','https://github.com/Henrik8210/gear-quest-forever','Older item-stat snapshot used only when no current Forever tooltip is available. Internal stat keys and derived school totals are excluded from fallback displays.'],['Mobalytics — Zone Level Ranges','https://mobalytics.gg/wow-forever/guides/zone-map-level-ranges','Additional user-recommended planning reference. Its article has not been read in this environment and is not presented as verified route evidence.']])main.append(sourceCard(name,url,desc));main.append(el('p','pending-box','Known data gaps: the Abominable Creatures pickup, several Ruins of Lordaeron quest-starting items, some Excavation chains and Past Due. The Treaty of Understanding: the screenshot shows level 9, the catalogue 16. The Fury Runs Deep: the screenshot shows 25, the catalogue 22. Researching the Corruption: the screenshot shows a chain, but the source does not confirm the prerequisite link. These are not marked as verified.'));const actions=el('div','source-actions');actions.append(button('Refresh Wowhead Tooltips',()=>{itemCache.clear();refreshItems=true;document.getElementById('saveStatus').textContent='Tooltip cache cleared — open a quest to fetch its tooltips again.'}),button('Import Updated Quest Data',()=>document.getElementById('importFile').click()),button('Back to Level Route',()=>{view='route';render()}));main.append(actions)}

const questWindow=document.querySelector('.frame'),reopenLog=document.getElementById('reopenLog');document.getElementById('closeLog').onclick=()=>{questWindow.hidden=true;reopenLog.hidden=false;reopenLog.focus()};reopenLog.onclick=()=>{questWindow.hidden=false;reopenLog.hidden=true;document.getElementById('closeLog').focus()};
document.getElementById('campingTab').onclick=showCamping;document.getElementById('professionsTab').onclick=showProfessions;document.getElementById('mapTab').onclick=()=>{view='map';selected=null;render()};document.getElementById('routeTab').onclick=()=>{view='route';selected=null;render()};document.getElementById('allTab').onclick=()=>{view='all';selected=null;render()};document.getElementById('search').oninput=()=>{selected=null;render()};document.getElementById('importBtn').onclick=showSources;document.getElementById('importFile').onchange=async e=>{const file=e.target.files[0];if(!file)return;try{if(file.size>2000000)throw Error('The file must be no larger than 2 MB.');const data=JSON.parse(await file.text());if(!Array.isArray(data.dungeons)||!data.dungeons.length)throw Error('The file must contain a dungeon list.');const ids=new Set();for(const d of data.dungeons){if(!d.id||ids.has(d.id)||typeof d.name!=='string'||!Number.isFinite(d.min)||!Number.isFinite(d.max)||!Array.isArray(d.quests))throw Error('Invalid dungeon or duplicate ID.');ids.add(d.id);d.zone=String(d.zone||'');d.intro=String(d.intro||'');d.verified=d.verified===true;const qids=new Set();for(const q of d.quests){if(!q.id||qids.has(q.id)||typeof q.name!=='string'||!Array.isArray(q.chain)||!Array.isArray(q.rewards)||!Number.isFinite(q.minLevel))throw Error('Invalid quest.');qids.add(q.id);for(const r of q.rewards)if(typeof r.name!=='string'||!Array.isArray(r.stats)||!r.stats.every(s=>typeof s==='string'))throw Error('Invalid reward.');if(!q.chain.every(s=>typeof s==='string'))throw Error('Invalid quest chain.')}}dungeons=data.dungeons.filter(d=>!/ragefire|chasm/i.test(d.name)&&d.id!=='ragefire');selected=null;view='all';render();document.getElementById('saveStatus').textContent='✓ Quest data imported for this session'}catch(err){document.getElementById('saveStatus').textContent='Import failed: '+err.message}e.target.value=''};render();
</script></body></html>
